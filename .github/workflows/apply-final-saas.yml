name: Apply final SaaS version

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-final-saas.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-final-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply the completed SaaS version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --index --3way final-saas.patch
          git rm -f .env
          git rm -f final-saas.patch
          git rm -f .github/workflows/apply-final-saas.yml
          git commit -m "Complete standalone Central do Comerciante SaaS"
          git push origin HEAD:main
